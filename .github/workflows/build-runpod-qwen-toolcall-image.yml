name: Build RunPod Qwen Toolcall Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "runpod-qwen-toolcall-docker/**"
      - ".github/workflows/build-runpod-qwen-toolcall-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/chiclooc-rgb/qwen-toolcall-vllm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./runpod-qwen-toolcall-docker
          file: ./runpod-qwen-toolcall-docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
